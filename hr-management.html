.pill.bad{background:var(--red-bg);color:var(--red)}

.scrim{display:none}

  .menu{display:grid;place-items:center}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .top,main{padding-left:16px;padding-right:16px}
  .top .date{display:none}
  .set{grid-template-columns:minmax(0,1fr)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

let S;

let route='dashboard';
const ui={q:'',dept:'All',dq:'',dt:'All',lf:'All'};

const emp=id=>S.emps.find(e=>e.id===id)||{id:0,name:'Unknown',role:'',dept:''};
const onLeave=id=>S.leaves.some(l=>l.emp===id&&l.status==='Approved'&&l.from<=TODAY&&TODAY<=l.to);
const status=e=>onLeave(e.id)?'On leave':e.status;
const COLORS=['#1F6F5C','#2A6A8C','#8A5E00','#7A4B8C','#A63A27','#4C6B2F'];
const av=e=>{const i=e.name.split(' ').map(w=>w[0]).slice(0,2).join('');return `<span class="av" style="background:${COLORS[e.id%COLORS.length]}">${esc(i)}</span>`};
const who=(e,sub)=>`<div class="who">${av(e)}<div><b>${esc(e.name)}</b><small>${esc(sub==null?e.role:sub)}</small></div></div>`;
const pill=(t,k)=>`<span class="pill ${k||'mute'}">${esc(t)}</span>`;
const stKind=s=>({Active:'ok',Probation:'warn','On leave':'info'}[s]||'mute');
const empty=t=>`<div class="empty">${t}</div>`;
const prog=p=>`<div class="prog" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>`;
const bars=(items,fmt)=>{const m=Math.max(1,...items.map(i=>i[1]));return items.map(i=>`<div class="hb"><span>${esc(i[0])}</span><div class="tr"><i style="width:${Math.max(3,i[1]/m*100)}%"></i></div><b>${fmt?fmt(i[1]):i[1]}</b></div>`).join('')};
const opts=(list,sel)=>list.map(o=>`<option${o===sel?' selected':''}>${esc(o)}</option>`).join('');
const activeEmps=()=>S.emps.filter(e=>!S.off.some(o=>o.emp===e.id&&o.last<TODAY));

function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2200)}
function commit(msg){save();render();if(msg)toast(msg)}
function notify(text,go){S.notes.unshift({id:nid(S.notes),text,time:'Just now',read:false,go})}

function dialog(html){const d=$('#dlg');d.innerHTML=html;if(!d.open)d.showModal()}
function closeDlg(){const d=$('#dlg');if(d.open)d.close()}
function modal(title,fields,onOk,okLabel){
  const body=fields.map(f=>`<label>${esc(f.label)}${f.req?' *':''}${f.type==='select'?`<select id="f_${f.k}">${f.o.map(o=>Array.isArray(o)?`<option value="${esc(o[0])}">${esc(o[1])}</option>`:`<option>${esc(o)}</option>`).join('')}</select>`:`<input id="f_${f.k}" type="${f.type||'text'}" value="${esc(f.v||'')}">`}</label>`).join('');
  dialog(`<div class="mh"><h3>${esc(title)}</h3><button class="x" data-a="close" aria-label="Close">✕</button></div><div class="mb">${body}</div><div class="mf"><button class="btn ghost" data-a="close">Cancel</button><button class="btn" id="mok">${esc(okLabel||'Save')}</button></div>`);
  $('#mok').onclick=()=>{const v={};fields.forEach(f=>v[f.k]=$('#f_'+f.k).value.trim());const miss=fields.find(f=>f.req&&!v[f.k]);if(miss){toast(miss.label+' is required');return}closeDlg();onOk(v)};
}

V.attendance=()=>{
  const list=S.emps.filter(e=>!onLeave(e.id));
  const lim=tomin(S.set.workStart)+ +S.set.grace;
  const rec=e=>S.att[e.id];
  const present=list.filter(e=>rec(e)).length;
  const late=list.filter(e=>rec(e)&&tomin(rec(e)[0])>lim).length;
  const away=S.emps.length-list.length;
  return `<div class="strip"><div><b>${present}</b><span>Clocked in</span></div><div><b>${late}</b><span>Late (after ${esc(S.set.workStart)} + ${S.set.grace} min)</span></div><div><b>${list.length-present}</b><span>Not in yet</span></div><div><b>${away}</b><span>On leave</span></div></div>
  <div class="panel"><div class="tw"><table><thead><tr><th>Employee</th><th>Status</th><th>In</th><th>Out</th><th>Hours</th><th class="r">Action</th></tr></thead><tbody>${S.emps.map(e=>{

    return `<tr><td>${who(e)}</td><td>${st}</td><td>${r?esc(r[0]):'–'}</td><td>${r&&r[1]?esc(r[1]):'–'}</td><td>${h}</td><td class="r">${!r?`<button class="btn sm" data-a="clockIn" data-id="${e.id}">Clock in</button>`:!r[1]?`<button class="btn sm ghost" data-a="clockOut" data-id="${e.id}">Clock out</button>`:''}</td></tr>`}).join('')}</tbody></table></div></div>`;

function docRows(){
  const q=ui.dq.toLowerCase();
  const rows=S.docs.filter(d=>(ui.dt==='All'||d.type===ui.dt)&&(!q||(d.name+' '+(d.cand||emp(d.emp).name)).toLowerCase().includes(q)));
  if(!rows.length)return empty('No documents match. Clear the filters or add a document.');
  const k={Signed:'ok',Active:'ok',Pending:'warn',Expired:'bad'};
  return `<div class="tw"><table><thead><tr><th>Document</th><th>Type</th><th>Belongs to</th><th>Updated</th><th>Status</th><th class="r">Action</th></tr></thead><tbody>${rows.map(d=>`<tr><td><b>${esc(d.name)}</b></td><td>${esc(d.type)}</td><td>${esc(d.cand||(d.emp?emp(d.emp).name:'Everyone'))}</td><td>${fdate(d.updated)}</td><td>${pill(d.status,k[d.status])}</td><td class="r">${d.status==='Pending'?`<button class="btn sm" data-a="docSign" data-id="${d.id}">Mark signed</button>`:''}</td></tr>`).join('')}</tbody></table></div>`;
}
V.documents=()=>`<div class="bar-tools"><input type="search" placeholder="Search documents" value="${esc(ui.dq)}" data-in="dq" aria-label="Search documents" style="min-width:240px"><select data-in="dt" aria-label="Type">${opts(['All','Contract','Policy','Tax','Offer','Certificate','Template'],ui.dt)}</select><span class="grow"></span><button class="btn" data-a="docAdd">Add document</button></div><div class="panel" id="tbl">${docRows()}</div>`;

V.relations=()=>{const k={High:'bad',Medium:'warn',Low:'mute'};const open=S.cases.filter(c=>c.status!=='Resolved').length;
  return `<div class="strip"><div><b>${open}</b><span>Open cases</span></div><div><b>${S.cases.filter(c=>c.sev==='High'&&c.status!=='Resolved').length}</b><span>High priority</span></div><div><b>${S.cases.filter(c=>c.status==='Resolved').length}</b><span>Resolved</span></div></div>
  <div class="bar-tools"><span class="grow"></span><button class="btn" data-a="caseAdd">Open a case</button></div>
  <div class="panel">${S.cases.length?`<div class="tw"><table><thead><tr><th>Case</th><th>Raised by</th><th>Opened</th><th>Priority</th><th>Status</th></tr></thead><tbody>${S.cases.map(c=>`<tr><td><b>${esc(c.type)}</b></td><td>${who(emp(c.emp))}</td><td>${fdate(c.opened)}</td><td>${pill(c.sev,k[c.sev])}</td><td><select data-c="caseSt" data-id="${c.id}" aria-label="Status">${opts(['Open','Investigating','Resolved'],c.status)}</select></td></tr>`).join('')}</tbody></table></div>`:empty('No cases. Open a case when an employee raises a concern.')}</div>`;};

V.offboarding=()=>`<p class="lead">Make sure nothing is missed when someone leaves: access, equipment, final pay and handover.</p><div class="bar-tools"><span class="grow"></span><button class="btn" data-a="offAdd">Start offboarding</button></div>${S.off.length?`<div class="grid3">${S.off.map(o=>{const e=emp(o.emp);const d=o.tasks.filter(t=>t.done).length;const p=Math.round(d/o.tasks.length*100);return `<div class="panel"><div class="pb">${who(e,e.role)}<p style="color:var(--muted);margin:10px 0 0">${esc(o.reason)} · last day ${fdate(o.last)}</p><div style="display:flex;gap:10px;align-items:center;margin:10px 0 6px">${prog(p)}<b>${p}%</b></div>${o.tasks.map((t,i)=>`<label class="chk${t.done?' done':''}"><input type="checkbox" data-c="offTick" data-id="${o.id}" data-i="${i}"${t.done?' checked':''}><span>${esc(t.t)}</span></label>`).join('')}</div></div>`}).join('')}</div>`:empty('No one is leaving. Start offboarding when an employee gives notice.')}`;

V.reports=()=>{
  const list=S.emps;
  const ten=list.reduce((s,e)=>s+(new Date(TODAY)-new Date(e.start))/(365.25*864e5),0)/list.length;
  const rated=S.perf.filter(p=>p.rating);const avg=rated.length?(rated.reduce((s,p)=>s+p.rating,0)/rated.length).toFixed(1):'–';
  const types=['Annual','Sick','Parental','Unpaid'];
  const lv=types.map(t=>[t,S.leaves.filter(l=>l.type===t&&l.status!=='Declined').reduce((s,l)=>s+wd(l.from,l.to),0)]);
  const pay=DEPTS.map(d=>[d,S.emps.filter(e=>e.dept===d).reduce((s,e)=>s+gross(e),0)]);
  const src={};S.cands.forEach(c=>src[c.source]=(src[c.source]||0)+1);
  return `<div class="strip"><div><b>${list.length}</b><span>Headcount</span></div><div><b>${ten.toFixed(1)}</b><span>Average years of service</span></div><div><b>${avg}</b><span>Average rating</span></div><div><b>${S.cands.filter(c=>c.stage!=='Hired').length}</b><span>Active candidates</span></div></div>
  <div class="grid3" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
   <div class="panel"><h3>Headcount by department</h3><div class="pb">${bars(DEPTS.map(d=>[d,list.filter(e=>e.dept===d).length]))}</div></div>
   <div class="panel"><h3>Leave days by type</h3><div class="pb">${bars(lv)}</div></div>
   <div class="panel"><h3>Monthly gross pay by department</h3><div class="pb">${bars(pay,money)}</div></div>
   <div class="panel"><h3>Where candidates come from</h3><div class="pb">${bars(Object.entries(src))}</div></div>
  </div>`;
};

V.notifications=()=>`<div class="bar-tools"><span class="grow"></span><button class="btn ghost" data-a="readAll">Mark all as read</button></div><div class="panel">${S.notes.length?`<ul class="queue">${S.notes.map(n=>`<li><span style="width:9px;height:9px;border-radius:50%;flex:none;background:${n.read?'transparent':'var(--accent)'};border:1px solid ${n.read?'var(--line)':'var(--accent)'}"></span><div class="tx" style="${n.read?'color:var(--muted)':''}"><b style="font-weight:${n.read?400:600}">${esc(n.text)}</b><small>${esc(n.time)}</small></div><div class="acts"><button class="btn sm ghost" data-a="go" data-v="${n.go}">Open</button><button class="btn sm ghost" data-a="noteTog" data-id="${n.id}">${n.read?'Mark unread':'Mark read'}</button></div></li>`).join('')}</ul>`:empty('You are all caught up.')}</div>`;

V.settings=()=>{const s=S.set;const row=(l,d,inp)=>`<div class="set"><div><b>${l}</b><small>${d}</small></div>${inp}</div>`;
  return `<div class="panel"><div class="pb">
  ${row('Company name','Shown in the sidebar.',`<input data-c="set" data-k="company" value="${esc(s.company)}">`)}
  ${row('Work day starts','Used to decide who is late.',`<input type="time" data-c="set" data-k="workStart" value="${esc(s.workStart)}">`)}
  ${row('Grace period (minutes)','Clock-ins within this window count as on time.',`<input type="number" min="0" max="120" data-c="set" data-k="grace" value="${s.grace}">`)}
  ${row('Annual leave (days)','Yearly allowance for each employee.',`<input type="number" min="0" max="60" data-c="set" data-k="annualDays" value="${s.annualDays}">`)}
  ${row('Payroll deductions (%)','Combined tax and social contributions applied to gross pay.',`<input type="number" min="0" max="60" data-c="set" data-k="deduction" value="${s.deduction}">`)}
  ${row('Appearance','Follow your device or pick a theme.',`<select data-c="set" data-k="theme">${['system','light','dark'].map(o=>`<option value="${o}"${s.theme===o?' selected':''}>${o[0].toUpperCase()+o.slice(1)}</option>`).join('')}</select>`)}
  ${row('Sample data','Restore the starting employees and requests. This removes your changes.',`<button class="btn bad" data-a="reset">Reset sample data</button>`)}
  </div></div>`;};

/* ---------- Actions ---------- */
const A={
 go(id,v){route=v;closeMenu();render();window.scrollTo(0,0)},
 menu(){$('#side').classList.toggle('open');$('#scrim').classList.toggle('open')},
 close(){closeDlg()},
 empView(id){const e=emp(id);dialog(`<div class="mh"><h3>${esc(e.name)}</h3><button class="x" data-a="close" aria-label="Close">✕</button></div><div class="mb"><dl class="kv"><dt>Role</dt><dd>${esc(e.role)}</dd><dt>Department</dt><dd>${esc(e.dept)}</dd><dt>Type</dt><dd>${esc(e.type)}</dd><dt>Status</dt><dd>${esc(status(e))}</dd><dt>Email</dt><dd>${esc(e.email)}</dd><dt>Start date</dt><dd>${fdate(e.start)}</dd><dt>Annual salary</dt><dd>${money(e.salary)}</dd></dl></div><div class="mf"><button class="btn bad" data-a="empOff" data-id="${e.id}">Start offboarding</button><button class="btn ghost" data-a="close">Close</button></div>`)},
 empOff(id){closeDlg();offForm(id)},
 empAdd(){modal('Add employee',[{k:'name',label:'Full name',req:1},{k:'role',label:'Job title',req:1},{k:'dept',label:'Department',type:'select',o:DEPTS},{k:'type',label:'Employment type',type:'select',o:['Full-time','Part-time','Contract']},{k:'salary',label:'Annual salary (USD)',type:'number',v:'60000',req:1},{k:'start',label:'Start date',type:'date',v:TODAY}],v=>{
   const id=nid(S.emps);S.emps.push({id,name:v.name,role:v.role,dept:v.dept,type:v.type,status:'Probation',start:v.start,salary:+v.salary||0,email:v.name.toLowerCase().replace(/[^a-z ]/g,'').replace(/ /g,'.')+'@northwind.example'});
   S.onb.push({id:nid(S.onb),emp:id,tasks:DEFAULT_ONB.map(t=>({t,done:false}))});notify(v.name+' was added and onboarding has started.','onboarding');commit(v.name+' added')})},
 deptAdd(){modal('Add department',[{k:'name',label:'Department name',req:1},{k:'head',label:'Department head',type:'select',o:empOpts()}],v=>{if(S.heads[v.name]){toast('That department already exists');return}S.heads[v.name]=+v.head;if(!DEPTS.includes(v.name))DEPTS.push(v.name);const e=emp(+v.head);e.dept=v.name;commit('Department added')})},
 jobAdd(){modal('Open a role',[{k:'title',label:'Job title',req:1},{k:'dept',label:'Department',type:'select',o:DEPTS},{k:'n',label:'Openings',type:'number',v:'1'}],v=>{S.jobs.push({id:nid(S.jobs),title:v.title,dept:v.dept,openings:+v.n||1});commit('Role opened')})},
 candAdd(){if(!S.jobs.length){toast('Open a role first');return}modal('Add candidate',[{k:'name',label:'Candidate name',req:1},{k:'role',label:'Role',type:'select',o:S.jobs.map(j=>j.title)},{k:'source',label:'Source',type:'select',o:['Careers page','Job board','Referral','Agency']}],v=>{S.cands.push({id:nid(S.cands),name:v.name,role:v.role,stage:'Applied',source:v.source});commit('Candidate added')})},
 candMove(id,v){const c=S.cands.find(x=>x.id===id);const i=S.stages.indexOf(c.stage)+ +v;if(i<0||i>=S.stages.length)return;c.stage=S.stages[i];if(c.stage==='Offer')notify('An offer is ready for '+c.name+'.','recruitment');commit(c.name+' moved to '+c.stage)},
 onbAdd(){const free=S.emps.filter(e=>!S.onb.some(o=>o.emp===e.id));if(!free.length){toast('Everyone already has an onboarding checklist');return}modal('Start onboarding',[{k:'emp',label:'Employee',type:'select',o:empOpts(free)}],v=>{S.onb.push({id:nid(S.onb),emp:+v.emp,tasks:DEFAULT_ONB.map(t=>({t,done:false}))});commit('Onboarding started')})},
 clockIn(id){S.att[id]=[nowHM(),''];commit(emp(id).name+' clocked in')},
 clockOut(id){S.att[id][1]=nowHM();commit(emp(id).name+' clocked out')},
 leaveAdd(){modal('Add leave request',[{k:'emp',label:'Employee',type:'select',o:empOpts()},{k:'type',label:'Leave type',type:'select',o:['Annual','Sick','Parental','Unpaid']},{k:'from',label:'From',type:'date',v:TODAY,req:1},{k:'to',label:'To',type:'date',v:TODAY,req:1}],v=>{if(v.to<v.from){toast('End date must be on or after the start date');return}S.leaves.push({id:nid(S.leaves),emp:+v.emp,type:v.type,from:v.from,to:v.to,status:'Pending'});commit('Request added')})},
 leaveSet(id,v){const l=S.leaves.find(x=>x.id===id);l.status=v;commit('Leave '+v.toLowerCase())},
 payNext(){S.payroll.status=S.payroll.status==='Draft'?'Approved':'Paid';commit('Payroll '+S.payroll.status.toLowerCase())},
 goalAdd(){modal('Add goal',[{k:'emp',label:'Employee',type:'select',o:empOpts()},{k:'goal',label:'Goal',req:1}],v=>{S.perf.push({emp:+v.emp,goal:v.goal,progress:0,rating:0});commit('Goal added')})},
 courseAdd(){modal('Add course',[{k:'title',label:'Course title',req:1},{k:'hours',label:'Hours',type:'number',v:'2'},{k:'req',label:'Required for everyone?',type:'select',o:['No','Yes']}],v=>{S.courses.push({id:nid(S.courses),title:v.title,hours:+v.hours||1,mandatory:v.req==='Yes'});commit('Course added')})},
 assignAdd(){modal('Assign course',[{k:'emp',label:'Employee',type:'select',o:empOpts()},{k:'course',label:'Course',type:'select',o:S.courses.map(c=>[String(c.id),c.title])}],v=>{S.assign.push({id:nid(S.assign),emp:+v.emp,course:+v.course,progress:0});commit('Course assigned')})},
 enrolAdd(){modal('Enrol employee',[{k:'emp',label:'Employee',type:'select',o:empOpts()},{k:'plan',label:'Plan',type:'select',o:S.plans.map(p=>[String(p.id),p.name])}],v=>{if(S.enrol.some(x=>x.emp===+v.emp&&x.plan===+v.plan)){toast('Already enrolled in this plan');return}S.enrol.push({emp:+v.emp,plan:+v.plan});commit('Enrolled')})},
 unenrol(id,v,el){event.preventDefault();S.enrol=S.enrol.filter(x=>!(x.emp===id&&x.plan===+v));commit('Enrolment removed')},
 docAdd(){modal('Add document',[{k:'name',label:'Document name',req:1},{k:'type',label:'Type',type:'select',o:['Contract','Policy','Tax','Offer','Certificate','Template']},{k:'emp',label:'Belongs to',type:'select',o:[['0','Everyone'],...empOpts()]},{k:'status',label:'Status',type:'select',o:['Pending','Signed','Active']}],v=>{S.docs.push({id:nid(S.docs),name:v.name,type:v.type,emp:+v.emp,updated:TODAY,status:v.status});commit('Document added')})},
 docSign(id){const d=S.docs.find(x=>x.id===id);d.status='Signed';d.updated=TODAY;commit('Marked as signed')},
 caseAdd(){modal('Open a case',[{k:'type',label:'What is it about?',req:1},{k:'emp',label:'Raised by',type:'select',o:empOpts()},{k:'sev',label:'Priority',type:'select',o:['Low','Medium','High']}],v=>{S.cases.push({id:nid(S.cases),type:v.type,emp:+v.emp,opened:TODAY,status:'Open',sev:v.sev});if(v.sev==='High')notify('A high-priority case was opened: '+v.type+'.','relations');commit('Case opened')})},
 offAdd(){offForm()},
 readAll(){S.notes.forEach(n=>n.read=true);commit('All caught up')},
 noteTog(id){const n=S.notes.find(x=>x.id===id);n.read=!n.read;commit()},
 reset(){if(confirm('Reset all data to the sample set?')){S=seed();commit('Sample data restored')}},
 // change handlers
 onbTick(id,v,el){const o=S.onb.find(x=>x.id===id);o.tasks[+el.dataset.i].done=el.checked;commit()},
 offTick(id,v,el){const o=S.off.find(x=>x.id===id);o.tasks[+el.dataset.i].done=el.checked;commit()},
 rate(i,v){S.perf[i].rating=+v;commit('Rating saved')},
 prog(id,v){S.assign.find(x=>x.id===id).progress=+v;commit()},
 caseSt(id,v){S.cases.find(x=>x.id===id).status=v;commit('Case marked '+v.toLowerCase())},
 set(id,v,el){const k=el.dataset.k;S.set[k]=el.type==='number'?+v:v;applyTheme();commit('Settings saved')}
};
function offForm(pre){
  const free=S.emps.filter(e=>!S.off.some(o=>o.emp===e.id));
  if(!free.length){toast('Everyone is already being offboarded');return}
  modal('Start offboarding',[{k:'emp',label:'Employee',type:'select',o:empOpts(free)},{k:'last',label:'Last working day',type:'date',v:'2026-10-30',req:1},{k:'reason',label:'Reason',type:'select',o:['Resignation','End of contract','Retirement','Dismissal']}],v=>{
    S.off.push({id:nid(S.off),emp:+v.emp,last:v.last,reason:v.reason,tasks:DEFAULT_OFF.map(t=>({t,done:false}))});notify(emp(+v.emp).name+' is leaving on '+fdate(v.last)+'.','offboarding');commit('Offboarding started')});
  if(pre)$('#f_emp').value=String(pre);
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f)f(+el.dataset.id,el.dataset.v,el)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(el&&A[el.dataset.c])A[el.dataset.c](+el.dataset.id,el.value,el);
  const s=e.target.closest('[data-in]');if(s&&s.tagName==='SELECT'){ui[s.dataset.in]=s.value;render()}});
document.addEventListener('input',e=>{const s=e.target.closest('[data-in]');if(!s||s.tagName==='SELECT')return;ui[s.dataset.in]=s.value;const t=$('#tbl');if(t)t.innerHTML=route==='employees'?empRows():docRows()});
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')closeDlg()});
function closeMenu(){$('#side').classList.remove('open');$('#scrim').classList.remove('open')}
function applyTheme(){const t=S.set.theme;if(t==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}

function render(){
  const unread=S.notes.filter(n=>!n.read).length;
  const badge={leave:S.leaves.filter(l=>l.status==='Pending').length,notifications:unread,relations:S.cases.filter(c=>c.status!=='Resolved').length};
  $('#nav').innerHTML=NAV.map(([id,l])=>`<button data-a="go" data-v="${id}"${id===route?' aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[id]}"/></svg>${l}${badge[id]?`<span class="badge">${badge[id]}</span>`:''}</button>`).join('');
  $('#title').textContent=NAV.find(n=>n[0]===route)[1];
  $('#co').textContent=S.set.company;
  $('#today').textContent=new Date(TODAY+'T00:00:00Z').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
  $('#main').innerHTML=V[route]();
}
applyTheme();render();
</script>
</body>
</html>
